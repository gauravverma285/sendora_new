{% extends 'services.html' %}
{% load static %}

{% block design %}
<style>
    .locked-wrap { max-width: 760px; margin: 20px auto 0; text-align: center; }
    .locked-preview {
        position: relative; border-radius: 14px; overflow: hidden;
        border: 1.5px solid #e7ebee; background: #f3f5f7;
        aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center;
    }
    .locked-preview img {
        width: 100%; height: 100%; object-fit: cover; filter: blur(2px) saturate(0.7);
        transform: scale(1.02);
    }
    .locked-preview__fallback { color: #9aa5b1; font-size: 15px; }
    .locked-preview__overlay {
        position: absolute; inset: 0; background: rgba(17, 24, 39, .38);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    .locked-preview__lock {
        width: 56px; height: 56px; border-radius: 50%; background: #fff; color: var(--au-green, #51B56D);
        display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .locked-preview__overlay span { color: #fff; font-weight: 600; font-size: 15px; }
    .locked-title { font-size: 22px; font-weight: 700; margin: 22px 0 6px; }
    .locked-blurb { color: #6b7280; font-size: 14.5px; margin: 0 0 22px; }
</style>

<div class="app-page">
    <div class="locked-wrap">
        <div class="locked-preview">
            <img src="{% static 'images/feature_previews/'|add:feature_image %}" alt="{{ feature_label }} preview"
                 onerror="this.style.display='none'; this.parentElement.querySelector('.locked-preview__fallback').style.display='block';">
            <div class="locked-preview__fallback" style="display:none;">Preview coming soon</div>
            <div class="locked-preview__overlay">
                <div class="locked-preview__lock"><i class="mdi mdi-lock-outline"></i></div>
                <span>Not included in your plan</span>
            </div>
        </div>

        <h2 class="locked-title">{{ feature_label }} is a premium feature</h2>
        <p class="locked-blurb">{{ feature_blurb }}</p>

        <a href="{% url 'billing:plan_list' %}" class="btn-au-primary">
            <i class="mdi mdi-crown-outline"></i> Upgrade your plan
        </a>
    </div>
</div>
{% endblock design %}
