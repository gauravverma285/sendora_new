{% extends 'account/_auth_layout.html' %}
{% block title %}Continue with {{ provider }} - Dovix AI{% endblock %}

{% block auth_content %}
<div class="auth-icon-badge"><i class="mdi mdi-google"></i></div>
<h2 class="auth-card__title">Continue with {{ provider }}</h2>
<p class="auth-card__sub">You're about to sign in to Dovix AI using your {{ provider }} account.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn auth-btn-primary w-100">Continue</button>
</form>
<a href="{% url 'account_login' %}" class="btn auth-btn-outline w-100 mt-2">Cancel</a>
{% endblock %}
