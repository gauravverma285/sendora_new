name: sendora

x-app: &app
  build: ..
  image: sendora-app:local
  env_file: .env
  restart: unless-stopped
  volumes:
    - media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  web:
    <<: *app
    command: ["web"]
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      # Host header must be in DJANGO_ALLOWED_HOSTS or Django answers 400.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/', headers={'Host': 'sendora.systems', 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 10s
      start_period: 60s
      retries: 10

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app
    command: ["beat"]
    depends_on:
      web:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: sendora-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - web
    networks:
      - default
      - edge

volumes:
  pgdata:
  redisdata:
  media:
  static:

networks:
  # Shared with the server's existing Caddy so it can reach sendora-proxy.
  edge:
    name: sendora_edge
    external: true
