# Sits behind the server's shared Caddy (which terminates TLS for every site
# on the box) and in front of gunicorn. Serves static/media directly.
server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # Caddy already set this to https; pass it on so Django sees a secure request.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
